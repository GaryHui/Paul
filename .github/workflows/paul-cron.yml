name: PAUL automation cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-due:
    runs-on: ubuntu-latest
    steps:
      - name: Run protected automation task
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PAUL_AUTOMATION_URL: https://paul-prophecy.vercel.app/api/automation/run-due
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET GitHub secret is not configured."
            exit 1
          fi
          curl --fail --show-error --silent \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$PAUL_AUTOMATION_URL"

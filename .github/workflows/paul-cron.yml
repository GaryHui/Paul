name: PAUL automation cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-due:
    runs-on: ubuntu-latest
    steps:
      - name: Run protected automation task
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PAUL_AUTOMATION_URL: https://paul-prophecy.vercel.app/api/automation/run-due
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET GitHub secret is not configured."
            exit 1
          fi
          response_file="$(mktemp)"
          status_code="$(curl --show-error --silent \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$PAUL_AUTOMATION_URL")"
          echo "HTTP status: $status_code"
          cat "$response_file"
          echo
          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            exit 1
          fi
